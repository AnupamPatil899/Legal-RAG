services:
  pinecone-local:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    ports:
      - "5081-5090:5081-5090"
    environment:
      PORT: "5081"
      PINECONE_HOST: "pinecone-local"
    volumes:
      - pinecone_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      PINECONE_HOST: "http://pinecone-local:5081"
      PINECONE_API_KEY: "pclocal"
      QDRANT_COLLECTION: enterprise_rag
      RATE_LIMIT_PER_MINUTE: "60"
      RAG_API_KEY: ""
      LOGFIRE_IGNORE_NO_CONFIG: "1"
    env_file:
      - .env
    depends_on:
      - pinecone-local
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080" ]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://api:8080
      LOGFIRE_IGNORE_NO_CONFIG: "1"
    env_file:
      - .env
    volumes:
      - ./ui:/app/ui:ro
    depends_on:
      - api
    command: [ "streamlit", "run", "ui/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0" ]

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PINECONE_HOST: "http://pinecone-local:5081"
      PINECONE_API_KEY: "pclocal"
    env_file:
      - .env
    volumes:
      - ./DATA:/app/DATA
      - ./processed_data:/app/processed_data
    depends_on:
      - pinecone-local
    command: [ "python", "-m", "app.ingestion.processor", "DATA" ]
    profiles:
      - ingest

volumes:
  pinecone_data:
