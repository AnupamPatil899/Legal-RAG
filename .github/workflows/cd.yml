name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOYER_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  RUNTIME_SA: ${{ secrets.CLOUD_RUN_RUNTIME_SA }}
  API_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE_API }}
  UI_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE_UI }}
  BACKEND_URL: ${{ secrets.BACKEND_URL }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Debug variables
        run: |
          echo "REGION='${REGION}'"
          echo "PROJECT_ID='${PROJECT_ID}'"
          echo "REPOSITORY='${REPOSITORY}'"

          echo "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/rag-api:${GITHUB_SHA}"

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/rag-app:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/rag-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API
        run: |
          gcloud run deploy "$API_SERVICE" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/rag-app:${GITHUB_SHA}" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --memory=2Gi \
            --allow-unauthenticated \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,JINA_API_KEY=JINA_API_KEY:latest,PORTKEY_API_KEY=PORTKEY_API_KEY:latest,PORTKEY_PRIMARY_CONFIG_ID=PORTKEY_PRIMARY_CONFIG_ID:latest,NEON_DB_URL=NEON_DB_URL:latest,QDRANT_URL=QDRANT_URL:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,RAG_API_KEY=RAG_API_KEY:latest,LOGFIRE_TOKEN=LOGFIRE_TOKEN:latest,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest

      - name: Deploy UI
        run: |
          gcloud run deploy "$UI_SERVICE" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/rag-app:${GITHUB_SHA}" \
            --region="$REGION" \
            --platform=managed \
            --memory=2Gi \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --command="streamlit" \
            --args="run,ui/app.py,--server.port,8080,--server.address,0.0.0.0" \
            --set-env-vars=BACKEND_URL=${BACKEND_URL},LOGFIRE_IGNORE_NO_CONFIG=1 \
            --set-secrets=LOGFIRE_TOKEN=LOGFIRE_TOKEN:latest
